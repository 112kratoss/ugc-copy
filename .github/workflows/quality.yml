name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://magicbooklet.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder-razorpay-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          KIE_AI_API_KEY: ci-placeholder-kie-key
          WEBHOOK_SECRET: ci-placeholder-webhook-secret
          CRON_SECRET: ci-placeholder-cron-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
          REVENUECAT_REST_API_KEY: ci-placeholder-revenuecat-key
          REVENUECAT_WEBHOOK_AUTH_TOKEN: ci-placeholder-revenuecat-webhook-token

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ugc-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  supabase-migrations:
    name: Supabase migration dry-run
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dry-run pending migrations
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL is not configured; skipping Supabase migration dry-run."
            exit 0
          fi

          npm install --global supabase@2.75.0
          supabase db push --dry-run --yes --db-url "$SUPABASE_DB_URL"
