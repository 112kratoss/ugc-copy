name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck production app
        run: npm run typecheck

      - name: Typecheck operational scripts
        run: npm run typecheck:scripts

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://magicbooklet.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder-razorpay-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          KIE_AI_API_KEY: ci-placeholder-kie-key
          WEBHOOK_SECRET: ci-placeholder-webhook-secret
          CRON_SECRET: ci-placeholder-cron-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
          REVENUECAT_REST_API_KEY: ci-placeholder-revenuecat-key
          REVENUECAT_WEBHOOK_AUTH_TOKEN: ci-placeholder-revenuecat-webhook-token

      - name: Verify packaged FFmpeg runtime
        run: npm run build:verify

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ugc-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  supabase-migrations:
    name: Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@2.75.0

      - name: Start isolated Supabase database
        run: |
          set -euo pipefail
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration from a clean database
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed --yes

      - name: Stop isolated Supabase database
        if: always()
        run: supabase stop --no-backup
