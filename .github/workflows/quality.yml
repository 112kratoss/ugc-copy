name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck production app
        run: npm run typecheck

      - name: Typecheck operational scripts
        run: npm run typecheck:scripts

      - name: Typecheck test suite
        run: npm run typecheck:tests

      - name: Validate production performance budgets
        run: npm run perf:load:self-test && npm run perf:lighthouse:self-test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://magicbooklet.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder-razorpay-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          KIE_AI_API_KEY: ci-placeholder-kie-key
          WEBHOOK_SECRET: ci-placeholder-webhook-secret
          CRON_SECRET: ci-placeholder-cron-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
          REVENUECAT_REST_API_KEY: ci-placeholder-revenuecat-key
          REVENUECAT_WEBHOOK_AUTH_TOKEN: ci-placeholder-revenuecat-webhook-token

      - name: Verify packaged FFmpeg runtime
        run: npm run build:verify

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright boots its own dev server on :3100 with the E2E auth bypass
      # (see playwright.config.ts). The authenticated workflow test stubs only
      # persistence APIs; public version and auth-boundary checks use the real
      # app routes. The bypass stays dev-only because `next dev` never runs a
      # production build.
      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder-razorpay-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          KIE_AI_API_KEY: ci-placeholder-kie-key
          WEBHOOK_SECRET: ci-placeholder-webhook-secret
          CRON_SECRET: ci-placeholder-cron-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
          REVENUECAT_REST_API_KEY: ci-placeholder-revenuecat-key
          REVENUECAT_WEBHOOK_AUTH_TOKEN: ci-placeholder-revenuecat-webhook-token

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ugc-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo dependency alignment
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx --yes expo-doctor@1.20.1

      - name: Test production build environment guard
        run: npm run release-env:self-test

      - name: Validate production native configuration
        run: npx expo prebuild --clean --no-install
        env:
          MAGICBOOKLET_INCLUDE_DEV_CLIENT: "false"

      - name: Bundle production JavaScript
        run: |
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/magicbooklet-export-ios"
          npx expo export --platform android --output-dir "$RUNNER_TEMP/magicbooklet-export-android"
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.com
          EXPO_PUBLIC_WEB_API_BASE_URL: https://example.com
          EXPO_PUBLIC_SITE_URL: https://example.com
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ci-placeholder
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ci-placeholder

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  supabase-migrations:
    name: Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start isolated Supabase database
        run: |
          set -euo pipefail
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration from a clean database
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed --yes

      - name: Test database behavior
        run: supabase test db

      # pgTAP runs each file inside a single transaction, so it structurally
      # cannot hold two open at once and cannot express a true race. This step
      # covers the concurrency property that pgTAP leaves untested, and runs
      # here because this is the only job with a live database.
      - name: Install dependencies
        run: npm ci

      - name: Test credit unlock concurrency
        run: npx vitest run src/__tests__/credit-unlock-concurrency.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Stop isolated Supabase database
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
