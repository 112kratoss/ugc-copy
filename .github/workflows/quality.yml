name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # supabase-migration-future-stamp.test.ts checks the migrations a change
      # adds, which it finds by comparing this checkout with main. A pull
      # request's checkout holds only its own merge commit, so main is fetched
      # here; without it the test falls back to checking every file.
      - name: Fetch main for the migration stamp check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify inherited staging locks with real FFmpeg
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/audits/audit-video-poster-owner-lifetime.ts --verify-reader-lease

      - name: Verify media scratch reclamation with real FFmpeg
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/audits/audit-media-scratch-lifetime.ts

      - name: Verify encoder output bounds with real FFmpeg
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/audits/audit-media-output-limits.ts

      - name: Verify cross-process staging admission
        run: npx tsx --tsconfig tsconfig.scripts.json scripts/audits/audit-staging-admission.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck production app
        run: npm run typecheck

      - name: Typecheck operational scripts
        run: npm run typecheck:scripts

      - name: Typecheck test suite
        run: npm run typecheck:tests

      - name: Validate production performance budgets
        run: npm run perf:load:self-test && npm run perf:lighthouse:self-test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://magicbooklet.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder-razorpay-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          KIE_AI_API_KEY: ci-placeholder-kie-key
          WEBHOOK_SECRET: ci-placeholder-webhook-secret
          CRON_SECRET: ci-placeholder-cron-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
          REVENUECAT_REST_API_KEY: ci-placeholder-revenuecat-key
          REVENUECAT_WEBHOOK_AUTH_TOKEN: ci-placeholder-revenuecat-webhook-token

      - name: Verify packaged FFmpeg runtime
        run: npm run build:verify

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # The browser download is the slow, stall-prone half; the system deps are
      # apt packages that are largely preinstalled on the runner. On a cache hit
      # skip the download entirely. The timeout keeps a hung CDN fetch from
      # eating the whole 30-minute job budget before any test runs.
      - name: Install Playwright Chromium
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Playwright boots its own dev server on :3100 with the E2E auth bypass
      # (see playwright.config.ts). The authenticated workflow test stubs only
      # persistence APIs; public version and auth-boundary checks use the real
      # app routes. The bypass stays dev-only because `next dev` never runs a
      # production build.
      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder-razorpay-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          KIE_AI_API_KEY: ci-placeholder-kie-key
          WEBHOOK_SECRET: ci-placeholder-webhook-secret
          CRON_SECRET: ci-placeholder-cron-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-razorpay-secret
          RAZORPAY_WEBHOOK_SECRET: ci-placeholder-razorpay-webhook-secret
          REVENUECAT_REST_API_KEY: ci-placeholder-revenuecat-key
          REVENUECAT_WEBHOOK_AUTH_TOKEN: ci-placeholder-revenuecat-webhook-token

      # A failed test leaves its trace in test-results/ (trace: 'retain-on-failure'
      # in playwright.config.ts) and the runner is gone when the job ends. Kept for
      # a week, the next failure can be read instead of guessed at. The run uses
      # the placeholder values above, so a trace holds no secret.
      - name: Upload the traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ugc-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo dependency alignment
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx --yes expo-doctor@1.20.1

      - name: Test production build environment guard
        run: npm run release-env:self-test

      - name: Validate production native configuration
        run: npx expo prebuild --clean --no-install
        env:
          MAGICBOOKLET_INCLUDE_DEV_CLIENT: "false"

      - name: Bundle production JavaScript
        run: |
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/magicbooklet-export-ios"
          npx expo export --platform android --output-dir "$RUNNER_TEMP/magicbooklet-export-android"
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.com
          EXPO_PUBLIC_WEB_API_BASE_URL: https://example.com
          EXPO_PUBLIC_SITE_URL: https://example.com
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ci-placeholder
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ci-placeholder

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  supabase-api:
    name: Supabase API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      # The SQL-only job deliberately excludes these API services. This job
      # replays independently and exercises actual Auth, Storage and PostgREST.
      # Keep generated local keys in private runner files, never log/artifact them.
      - name: Start isolated Supabase API stack
        run: |
          set -euo pipefail
          umask 077
          fixture_dir="$RUNNER_TEMP/supabase-api"
          status_file="$RUNNER_TEMP/supabase-api-status.json"
          mkdir -p "$fixture_dir/supabase"
          cp supabase/config.api-tests.toml "$fixture_dir/supabase/config.toml"
          ln -s "$GITHUB_WORKSPACE/supabase/migrations" "$fixture_dir/supabase/migrations"
          supabase --workdir "$fixture_dir" start --exclude realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-api-start.log" 2>&1
          supabase --workdir "$fixture_dir" db reset --local --no-seed --yes
          supabase --workdir "$fixture_dir" status -o json > "$status_file"
          printf 'AUDIT_STORAGE_CONFIG=%s\n' "$status_file" >> "$GITHUB_ENV"

      # Deletion claims are global. Separate invocations keep fixtures sequential;
      # the suite's explicit process-kill and concurrent-worker cases still run.
      - name: Test account deletion with real Auth and Storage
        run: npx vitest run --config vitest.account-deletion-postgrest.config.ts

      - name: Test operations ingress with real PostgREST and SQL
        run: npx vitest run --config vitest.ops-postgrest.config.ts

      - name: Test admin collectors with real PostgREST and SQL
        run: npx vitest run --config vitest.admin-collectors-postgrest.config.ts

      - name: Test signup collisions with real Auth and SQL
        run: npx vitest run --config vitest.auth-signup-postgrest.config.ts

      - name: Test workflow authoring and billing with real Auth and PostgREST
        run: npx vitest run --config vitest.workflow-authoring-postgrest.config.ts

      - name: Test template publication with real Auth, Storage and PostgREST
        run: npx vitest run --config vitest.template-publication-postgrest.config.ts

      - name: Test template run identity with real Auth, Storage and PostgREST
        run: npx vitest run --config vitest.template-run-auth-postgrest.config.ts

      - name: Test admin moderation with authoritative sessions and real SQL
        run: npx vitest run --config vitest.admin-moderation-postgrest.config.ts

      - name: Test moderation revocation and retries with real Storage and SQL
        run: npx vitest run --config vitest.moderation-storage-postgrest.config.ts

      - name: Test background revocation with real Storage and durable SQL paths
        run: npx vitest run --config vitest.showcase-revocation-postgrest.config.ts

      - name: Test background revocation after actual worker death
        run: npx vitest run --config vitest.showcase-revocation-worker-death-postgrest.config.ts

      - name: Test onboarding and admin credit inputs with real Auth and SQL
        run: npx vitest run --config vitest.auth-credit-inputs-postgrest.config.ts

      - name: Test referral notification recovery with real SQL and local HTTP
        run: npx vitest run --config vitest.referral-recovery-postgrest.config.ts

      - name: Test referral account deletion and retained reconciliation with real Auth and SQL
        run: npx vitest run --config vitest.referral-account-deletion-postgrest.config.ts

      - name: Test referral intake ownership and admission with real Auth and SQL
        run: npx vitest run --config vitest.referral-intake-postgrest.config.ts

      - name: Test bounded referral settlement progress with real PostgREST and SQL
        run: npx vitest run --config vitest.referral-settlement-progress-postgrest.config.ts

      - name: Test unstarted rendition reservations with real Storage and SQL
        run: npx vitest run --config vitest.media-rendition-budget-postgrest.config.ts

      - name: Test staged upload cleanup recovery with real Storage and SQL
        run: npx vitest run --config vitest.media-upload-reclaim-postgrest.config.ts

      - name: Test workflow scheduler admission with real PostgREST and SQL
        run: npx vitest run --config vitest.workflow-managed-postgrest.config.ts

      - name: Test private signed reads with real Auth and Storage
        run: npx vitest run --config vitest.private-storage-postgrest.config.ts

      - name: Test profile media ownership and retries with real Storage and SQL
        run: npx vitest run --config vitest.profile-media-postgrest.config.ts

      - name: Test profile request byte bounds with real Auth and SQL
        run: npx vitest run --config vitest.profile-request-bounds-postgrest.config.ts

      - name: Stop isolated Supabase API stack
        if: always()
        continue-on-error: true
        run: |
          supabase --workdir "$RUNNER_TEMP/supabase-api" stop --no-backup
          rm -f "$RUNNER_TEMP/supabase-api-status.json" "$RUNNER_TEMP/supabase-api-start.log"

  supabase-migrations:
    name: Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start isolated Supabase database
        run: |
          set -euo pipefail
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration from a clean database
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed --yes

      - name: Test database behavior
        run: supabase test db

      # pgTAP runs each file inside a single transaction, so it structurally
      # cannot hold two open at once and cannot express a true race. This step
      # covers the concurrency property that pgTAP leaves untested, and runs
      # here because this is the only job with a live database.
      - name: Install dependencies
        run: npm ci

      - name: Test credit unlock concurrency
        run: npx vitest run src/__tests__/credit-unlock-concurrency.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test cash commerce concurrency
        run: npx vitest run src/__tests__/commerce-cash-concurrency.test.ts src/__tests__/mobile-credit-concurrency.test.ts src/__tests__/mobile-adjustment-event-concurrency.test.ts src/__tests__/mobile-marketplace-lifecycle-concurrency.test.ts src/__tests__/mobile-legacy-binding-concurrency.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test payment handlers with real settlement SQL
        run: npx vitest run src/__tests__/razorpay-adjustment-database.test.ts src/__tests__/mobile-receipt-identity-database.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # These suites run unscoped queue claim RPCs against one shared database.
      # Keep files sequential; their explicit worker/concurrency probes still run.
      - name: Test generation recovery with real settlement SQL
        run: npx vitest run --no-file-parallelism src/__tests__/generation-output-recovery-database.test.ts src/__tests__/generation-grace-recovery-database.test.ts src/__tests__/generation-start-recovery-database.test.ts src/__tests__/generation-worker-crash-database.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # A step of its own: this file runs the template run job processor, which
      # claims whichever run job is due, so no other file may be creating
      # template runs while it does.
      - name: Test template run retries with real start and settlement SQL
        run: npx vitest run src/__tests__/template-run-step-busy-retry-database.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # A step of its own for the same reason, and one more: the processor's
      # sweep looks at every template run still in progress, and this file
      # moves the sweep's clock forward.
      - name: Test template run recovery with real queue SQL
        run: npx vitest run src/__tests__/template-run-job-exhaustion-database.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # A step of its own for the same reason as the two above, and one more:
      # its cases for two passes on one step hold the run's row from a second
      # connection while the processor runs.
      - name: Test template run steps the database will not start with real start SQL
        run: npx vitest run src/__tests__/template-run-step-refused-start-database.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test canvas lifecycle with real execution and settlement SQL
        run: npx vitest run src/__tests__/workflow-run-lifecycle-database.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test assistant proposal transitions with real authenticated SQL
        run: npx vitest run src/__tests__/workflow-assistant-transitions-database.test.ts
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Test canvas authoring with real authenticated SQL
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/__tests__/workflow-canvas-authoring-database.test.ts

      - name: Test workflow share imports with real authenticated SQL
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/__tests__/workflow-share-import-database.test.ts

      - name: Test save counters and deletion with real SQL
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/__tests__/post-save-counter-database.test.ts

      - name: Test follow and block concurrency with real SQL
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/__tests__/follow-block-concurrency-database.test.ts

      - name: Test comment lifecycle with real SQL
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/__tests__/post-comment-lifecycle-database.test.ts

      - name: Test push registration concurrency with real SQL
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/__tests__/mobile-push-registration-database.test.ts

      - name: Test empty interest refresh progress with real SQL
        env:
          SUPABASE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/__tests__/feed-interest-progress-database.test.ts

      - name: Stop isolated Supabase database
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
