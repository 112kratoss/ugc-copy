name: Apple web client secret

# Applies a fresh 180-day client secret to the Supabase Apple provider on the 1st
# of every month, so the website's Continue with Apple never meets Apple's
# six-month ceiling. What it checks, how it alerts, and how to rotate the key are
# under "Sign in with Apple on the web" in docs/production-deployment-runbook.md.
#
# Repository secrets, not the production environment's: on GitHub Free a private
# repository cannot read environment secrets.

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      rotate:
        description: The key was rotated; apply over the old key's secret (runbook, "Rotating the key")
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  # Not secret: the key id and team sit in every client secret's header and
  # claims, the Services ID in every authorize address, and the SHA-256 is of
  # the key's public half. The script refuses a key whose public half differs.
  APPLE_SIGN_IN_KEY_ID: 6924Q753C6
  APPLE_SIGN_IN_KEY_SHA256: 2a7dc30d007a7c98cf8a5bf767529e236a37b179f749ec499c1ff6a292aa693d
  APPLE_TEAM_ID: 5HNNML93ST
  APPLE_WEB_SERVICES_ID: com.magicbooklet.mobile.web

jobs:
  renew:
    name: Renew the Apple web client secret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Self-test the script
        run: node scripts/ops/apple-web-client-secret.mjs --self-test

      # Never prints the secret, and never reads the Management API's answer to
      # the update, which echoes it; its one line goes to the run's summary.
      - name: Mint a new secret and apply it to Supabase
        env:
          APPLE_SIGN_IN_PRIVATE_KEY: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY }}
          SUPABASE_MANAGEMENT_API_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN }}
          ROTATE_FLAG: ${{ inputs.rotate && '--rotate' || '' }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${APPLE_SIGN_IN_PRIVATE_KEY}" ] || missing="APPLE_SIGN_IN_PRIVATE_KEY"
          [ -n "${SUPABASE_MANAGEMENT_API_TOKEN}" ] || missing="${missing:+${missing} and }SUPABASE_AUTH_CONFIG_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error title=Renewal not configured::Repository secret ${missing} is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          node scripts/ops/apple-web-client-secret.mjs --apply-supabase ${ROTATE_FLAG} \
            --key-id "${APPLE_SIGN_IN_KEY_ID}" \
            --key-sha256 "${APPLE_SIGN_IN_KEY_SHA256}" \
            --team-id "${APPLE_TEAM_ID}" \
            --client-id "${APPLE_WEB_SERVICES_ID}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Check where Supabase sends Continue with Apple
        env:
          SUPABASE_MANAGEMENT_API_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN }}
          # Set the repository variable once a Supabase custom domain is active.
          SUPABASE_AUTH_CALLBACK_URL: ${{ vars.SUPABASE_AUTH_CALLBACK_URL }}
        run: node scripts/ops/production-external-gates.mjs --probe-apple-web-sign-in

      # One open issue, reused, and closed on recovery, as the backend watchdog
      # does. A job that times out counts as cancelled, not failed.
      - name: Open or update the incident issue
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INCIDENT_TITLE: Apple web client secret renewal is failing
        run: |
          set -uo pipefail
          existing=$(gh issue list --state open --search "\"${INCIDENT_TITLE}\" in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          stamp=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "Still failing as of ${stamp}. Run: ${RUN_URL}"
            echo "Commented on existing incident issue #${existing}."
          else
            gh issue create --title "${INCIDENT_TITLE}" --body "$(printf '%s\n' \
              "A step of the monthly renewal of the Apple client secret behind the website's Continue with Apple failed at ${stamp}." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              "The run's summary says whether a new secret was applied, and until when it lives. If none was, the one in Supabase keeps 180 days from the last applied renewal, and every web Apple sign-in fails once it ends. The fix and a manual renewal are under \"Sign in with Apple on the web\" in docs/production-deployment-runbook.md." \
              "" \
              "This issue closes automatically when the renewal next succeeds.")"
            echo "Opened a new incident issue."
          fi

      - name: Close the incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INCIDENT_TITLE: Apple web client secret renewal is failing
        run: |
          set -uo pipefail
          existing=$(gh issue list --state open --search "\"${INCIDENT_TITLE}\" in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --comment "Renewal recovered at $(date -u '+%Y-%m-%d %H:%M UTC'). Run: ${RUN_URL}"
            echo "Closed incident issue #${existing}."
          fi
