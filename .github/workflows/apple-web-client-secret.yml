name: Apple web client secret

# Renews the client secret behind the website's Continue with Apple (the
# runbook's "Sign in with Apple on the web"). Apple refuses a secret that lives
# longer than six months, and every web Apple sign-in fails the day the one in
# Supabase ends. So on the 1st of every month this mints a fresh 180-day secret
# and installs it in the Supabase Apple provider: the live one is never more
# than about a month old, and a run that fails leaves about five months to put
# it right.
#
# Two alert channels when it fails, as in the backend watchdog: GitHub's
# failure email, which for a scheduled workflow goes only to whoever last
# edited the cron expression, and an incident issue, which notifies every
# watcher of the repository.
#
# A run takes seconds and well under a billed minute once the repository is
# private: no npm install, because the script signs with Node's own crypto.

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two renewals at once would only race to install a valid secret; let both finish.
concurrency:
  group: apple-web-client-secret
  cancel-in-progress: false

env:
  # Not secret: the key id and team sit in every client secret's header and
  # claims, and the Services ID in every authorize address.
  APPLE_SIGN_IN_KEY_ID: 6924Q753C6
  APPLE_TEAM_ID: 5HNNML93ST
  APPLE_WEB_SERVICES_ID: com.magicbooklet.mobile.web

jobs:
  renew:
    name: Renew the Apple web client secret
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The script refuses to install into a provider the secret does not fit
      # (off, another client first, the iPhone bundle id missing), never prints
      # the secret, and never reads the Management API's answer, which echoes it.
      - name: Mint a new secret and install it in Supabase
        env:
          APPLE_SIGN_IN_PRIVATE_KEY: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_SIGN_IN_PRIVATE_KEY}" ] || [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error title=Renewal not configured::APPLE_SIGN_IN_PRIVATE_KEY or SUPABASE_ACCESS_TOKEN is missing from the production environment's secrets."
            exit 1
          fi
          node scripts/ops/apple-web-client-secret.mjs --install-supabase \
            --key-id "${APPLE_SIGN_IN_KEY_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --client-id "${APPLE_WEB_SERVICES_ID}"

      - name: Check where Supabase sends Continue with Apple
        env:
          SUPABASE_MANAGEMENT_API_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/ops/production-external-gates.mjs --probe-apple-web-sign-in

      # One open issue, reused, and closed on recovery, as the watchdog does.
      - name: Open or update the incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INCIDENT_TITLE: Apple web client secret renewal is failing
        run: |
          set -uo pipefail
          existing=$(gh issue list --state open --search "\"${INCIDENT_TITLE}\" in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          stamp=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "Still failing as of ${stamp}. Run: ${RUN_URL}"
            echo "Commented on existing incident issue #${existing}."
          else
            gh issue create --title "${INCIDENT_TITLE}" --body "$(printf '%s\n' \
              "The monthly renewal of the Apple client secret behind the website's Continue with Apple failed at ${stamp}." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              "The secret in Supabase lives 180 days from its last successful renewal, and every web Apple sign-in fails once it ends. The run log says which step failed; the fix and a manual renewal are under \"Sign in with Apple on the web\" in docs/production-deployment-runbook.md." \
              "" \
              "This issue closes automatically when the renewal next succeeds.")"
            echo "Opened a new incident issue."
          fi

      - name: Close the incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INCIDENT_TITLE: Apple web client secret renewal is failing
        run: |
          set -uo pipefail
          existing=$(gh issue list --state open --search "\"${INCIDENT_TITLE}\" in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --comment "Renewal recovered at $(date -u '+%Y-%m-%d %H:%M UTC'). Run: ${RUN_URL}"
            echo "Closed incident issue #${existing}."
          fi
