name: Mobile signed store build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Signed platform artifact to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
      submit_to_test_track:
        description: Submit successful builds to TestFlight / closed alpha
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact main revision
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.revision.outputs.release_sha }}
      app_version: ${{ steps.revision.outputs.app_version }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Require current main, green Quality, and live production release
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$release_sha" = "$remote_sha"
          app_version="$(node -p "require('./ugc-mobile/app.json').expo.version")"
          test "$app_version" = "0.0.5"
          successful_runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?head_sha=${release_sha}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )"
          test "$successful_runs" -gt 0
          successful_production_runs="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/production-release.yml/runs?head_sha=${release_sha}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )"
          test "$successful_production_runs" -gt 0
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate mobile release inputs
    needs: authorize
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-mobile
    steps:
      - name: Check out authorized revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ugc-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo dependency alignment
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx --yes expo-doctor@1.20.1

      - name: Test fail-closed production environment guard
        run: npm run release-env:self-test

      - name: Run mobile tests and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Validate production native configuration
        run: npx expo prebuild --clean --no-install
        env:
          MAGICBOOKLET_INCLUDE_DEV_CLIENT: "false"

  build:
    name: Signed ${{ matrix.platform }} build
    needs:
      - authorize
      - validate
    runs-on: ubuntu-latest
    environment: mobile-production
    env:
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://magicbooklet.com' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["ios","android"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Check out authorized revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.release_sha }}
          fetch-depth: 1

      - name: Require TestFlight internal group
        if: ${{ inputs.submit_to_test_track && matrix.platform == 'ios' }}
        env:
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
        run: |
          set -euo pipefail
          test -n "${TESTFLIGHT_INTERNAL_GROUP//[[:space:]]/}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ugc-mobile/package-lock.json

      - name: Install dependencies
        working-directory: ugc-mobile
        run: npm ci

      - name: Authenticate EAS
        working-directory: ugc-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@21.2.0 whoami

      - name: Verify production serves the authorized commit before build
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -euo pipefail
          production_origin="${PRODUCTION_BASE_URL%/}"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            "${production_origin}/api/app-version?release=${EXPECTED_SHA}&probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.platform }}-prebuild" \
            --output "${RUNNER_TEMP}/production-app-version-prebuild.json"
          EXPECTED_SHA="$EXPECTED_SHA" node -e "
            const fs = require('node:fs');
            const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/production-app-version-prebuild.json', 'utf8'));
            if (body.buildId !== process.env.EXPECTED_SHA) {
              throw new Error('Production serves ' + (body.buildId || 'an unknown build') + ', expected ' + process.env.EXPECTED_SHA);
            }
          "

      - name: Build signed production artifact
        id: build
        working-directory: ugc-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/eas-build-${{ matrix.platform }}.json"
          npx --yes eas-cli@21.2.0 build \
            --profile production \
            --platform "${{ matrix.platform }}" \
            --clear-cache \
            --non-interactive \
            --wait \
            --json \
            --message "GitHub main ${RELEASE_SHA}" > "$metadata"
          METADATA_PATH="$metadata" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.env.METADATA_PATH, 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          if (!build?.id) throw new Error('EAS did not return a build ID');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${build.id}\n`);
          NODE

      - name: Verify signed EAS store artifact
        id: verify
        working-directory: ugc-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPECTED_APP_VERSION: ${{ needs.authorize.outputs.app_version }}
          EXPECTED_BUILD_ID: ${{ steps.build.outputs.build_id }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -euo pipefail
          view="$RUNNER_TEMP/eas-build-view-${{ matrix.platform }}.json"
          npx --yes eas-cli@21.2.0 build:view "$EXPECTED_BUILD_ID" \
            --json > "$view"
          VIEW_PATH="$view" node ./scripts/verify-eas-store-build.mjs

      - name: Save verified build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-${{ matrix.platform }}-${{ needs.authorize.outputs.release_sha }}
          path: |
            ${{ runner.temp }}/eas-build-${{ matrix.platform }}.json
            ${{ runner.temp }}/eas-build-view-${{ matrix.platform }}.json
          retention-days: 30

      - name: Reconfirm main before test-track submission
        if: ${{ inputs.submit_to_test_track }}
        env:
          EXPECTED_SHA: ${{ needs.authorize.outputs.release_sha }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$EXPECTED_SHA"
          production_origin="${PRODUCTION_BASE_URL%/}"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            "${production_origin}/api/app-version?release=${EXPECTED_SHA}&probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.platform }}-presubmit" \
            --output "${RUNNER_TEMP}/production-app-version-presubmit.json"
          EXPECTED_SHA="$EXPECTED_SHA" node -e "
            const fs = require('node:fs');
            const body = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/production-app-version-presubmit.json', 'utf8'));
            if (body.buildId !== process.env.EXPECTED_SHA) {
              throw new Error('Production serves ' + (body.buildId || 'an unknown build') + ', expected ' + process.env.EXPECTED_SHA);
            }
          "

      - name: Submit to TestFlight or closed alpha
        id: submit
        if: ${{ inputs.submit_to_test_track }}
        working-directory: ugc-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
        run: |
          set -euo pipefail
          submission_log="$RUNNER_TEMP/eas-submit-${{ matrix.platform }}.log"
          submit_args=(
            --profile staging \
            --platform "${{ matrix.platform }}" \
            --id "$BUILD_ID" \
            --non-interactive \
            --wait
          )
          if [[ "${{ matrix.platform }}" == "ios" ]]; then
            test -n "${TESTFLIGHT_INTERNAL_GROUP//[[:space:]]/}"
            submit_args+=(--groups "$TESTFLIGHT_INTERNAL_GROUP")
          fi
          npx --yes eas-cli@21.2.0 submit "${submit_args[@]}" 2>&1 | tee "$submission_log"
          SUBMISSION_LOG_PATH="$submission_log" node ./scripts/verify-eas-store-build.mjs --submission

      - name: Write verified release summary
        if: ${{ always() && steps.verify.outcome == 'success' }}
        env:
          APP_VERSION: ${{ steps.verify.outputs.app_version }}
          BUILD_ID: ${{ steps.verify.outputs.build_id }}
          COMMIT_SHA: ${{ steps.verify.outputs.commit_sha }}
          NATIVE_BUILD_NUMBER: ${{ steps.verify.outputs.native_build_number }}
          PLATFORM: ${{ steps.verify.outputs.platform }}
          SUBMISSION_ID: ${{ steps.submit.outputs.submission_id }}
          SUBMISSION_REQUESTED: ${{ inputs.submit_to_test_track }}
        run: |
          set -euo pipefail
          submission_id="$SUBMISSION_ID"
          if [[ "$SUBMISSION_REQUESTED" != "true" ]]; then
            submission_id="not requested"
          elif [[ -z "$submission_id" ]]; then
            submission_id="unavailable (submission failed)"
          fi
          {
            echo "### Verified mobile tester artifact"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Platform | \`$PLATFORM\` |"
            echo "| App version | \`$APP_VERSION\` |"
            echo "| Native build number | \`$NATIVE_BUILD_NUMBER\` |"
            echo "| Build ID | \`$BUILD_ID\` |"
            echo "| Submission ID | \`$submission_id\` |"
            echo "| Commit SHA | \`$COMMIT_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
